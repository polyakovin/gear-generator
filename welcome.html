<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style>
		@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap");

		body {
			padding: 60px;
			background-color: #f5f5f5;
			color: #060607;
			font-family: Inter, Helvetica, Arial, sans-serif;
		}

		.content {
			width: 100%;
			max-width: 700px;
			text-align: center;
			margin: 0 auto;
		}

		.topbar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			width: 100%;
			max-width: 700px;
			margin: 0 auto 40px;
		}

		.back-link {
			color: #1769aa;
			font-weight: 700;
			text-decoration: none;
		}

		.back-link:hover,
		.back-link:focus-visible {
			text-decoration: underline;
		}

		.language-switch {
			display: inline-flex;
			min-width: 0;
			margin: 0;
			padding: 3px;
			border: 1px solid #d4d4d4;
			border-radius: 9px;
			background: #e9e9e9;
		}

		.visually-hidden {
			position: absolute;
			width: 1px;
			height: 1px;
			padding: 0;
			margin: -1px;
			overflow: hidden;
			clip: rect(0, 0, 0, 0);
			white-space: nowrap;
			border: 0;
		}

		.language-switch button {
			min-width: 42px;
			padding: 8px 9px;
			border: 0;
			border-radius: 6px;
			color: #666;
			background: transparent;
			font: 700 12px Inter, Helvetica, Arial, sans-serif;
			cursor: pointer;
		}

		.language-switch button.is-active {
			color: #060607;
			background: #fff;
			box-shadow: 0 1px 4px #0002;
		}

		.language-switch button:focus-visible {
			outline: 2px solid #1769aa;
			outline-offset: 1px;
		}

		h1, p, img {
			margin-top: 20px;
			max-width: 100%;
		}

		h1 {
			font-size: xxx-large;
		}

		h2 {
			font-size: xx-large;
			margin-top: 80px;
			margin-bottom: -60px;
		}

		p {
			font-size: 20px;
			margin: 80px auto 0;
			line-height: 1.5;
		}

		img {
			box-shadow: #0004 0 25px 50px -12px;
			border-radius: 12px;
			box-sizing: border-box;
			border: 1px solid #555555;
		}

		textarea {
			position: relative;
			display: block;
			width: 100%;
			height: auto;
			margin-top: 20px;
			box-sizing: border-box;
			padding: 13px 20px;
			border-radius: 8px;
			font-family: Inter, Helvetica, Arial, sans-serif;
			font-size: 20px;
			resize: none;
			overflow: hidden;
		}

		.image-with-textarea {
			margin-top: 30px;
		}

		/* small {
			font-size: small;
		} */

		span.emoji {
			transform: scale(1.7) translate(4px, -2px);
			display: inline-block;
		}

		article, section {
			position: relative;
		}

		article::before {
			position: absolute;
			left: -60px;
			content: '';
			height: 100%;
			width: 0px;
			border-left: 13px dashed #e6c34380;
			transform: scaleX(0.2);
		}

		section::before {
			position: absolute;
			left: -73px;
			top: -6px;
			content: '';
			height: 40px;
			width: 40px;
			background-color: #eedca1;
			border-radius: 50%;
		}

		@keyframes blink {
			0% {
				opacity: 1;
			}
			50% {
				opacity: .6;
			}
			100% {
				opacity: 1;
			}
		}

		@media (max-width: 600px) {
			body {
				padding: 24px 20px 48px;
			}

			h1 {
				font-size: 2rem;
			}

			p {
				margin-top: 56px;
				font-size: 17px;
			}

			article::before,
			section::before {
				display: none;
			}
		}
	</style>

<body>
	<noscript><div><img src="https://mc.yandex.ru/watch/106310794" style="position:absolute; left:-9999px;" alt="" /></div></noscript>
	<div class="topbar">
		<a class="back-link" href="./" data-i18n="openGenerator">Open generator</a>
		<fieldset class="language-switch">
			<legend class="visually-hidden" data-i18n="language">Language</legend>
			<button type="button" data-language="en">EN</button>
			<button type="button" data-language="ru">RU</button>
		</fieldset>
	</div>
	<div class="content">
		<h1 data-i18n="installed">Gear Generator installed!</h1>

		<article>
			<section>
				<p data-i18n="pinExtension">Click the puzzle piece (1) in the top right of your browser.<br>Then, click the little pin (2) next to the extension:</p>
				<img src="welcome-1.webp" alt="Pin the extension" data-i18n-alt="pinImageAlt">
			</section>

			<section>
				<p data-i18n="openExtension">
					Open the extension (3) on any page to start using Gear Generator:
				</p>
				<img class="image-with-textarea" src="welcome-2.webp" alt="Open the extension" data-i18n-alt="openImageAlt">
			</section>
		</article>
	</div>
	<script>
		const LANGUAGE_STORAGE_KEY = 'gear-generator-language';
		const translations = {
			en: {
				title: 'Gear Generator. Welcome!',
				language: 'Language',
				openGenerator: 'Open generator',
				installed: 'Gear Generator installed!',
				pinExtension: 'Click the puzzle piece (1) in the top right of your browser.<br>Then, click the little pin (2) next to the extension:',
				openExtension: 'Open the extension (3) on any page to start using Gear Generator:',
				pinImageAlt: 'Pin the extension',
				openImageAlt: 'Open the extension',
			},
			ru: {
				title: 'Генератор шестерён. Добро пожаловать!',
				language: 'Язык',
				openGenerator: 'Открыть генератор',
				installed: 'Генератор шестерён установлен!',
				pinExtension: 'Нажмите значок пазла (1) в правом верхнем углу браузера.<br>Затем нажмите значок булавки (2) рядом с расширением:',
				openExtension: 'Откройте расширение (3) на любой странице, чтобы начать работу с генератором шестерён:',
				pinImageAlt: 'Как закрепить расширение',
				openImageAlt: 'Как открыть расширение',
			},
		};

		const getInitialLanguage = () => {
			const urlLanguage = new URLSearchParams(window.location.search).get('lang');
			if (urlLanguage === 'en' || urlLanguage === 'ru') return urlLanguage;

			try {
				const savedLanguage = window.localStorage.getItem(LANGUAGE_STORAGE_KEY);
				if (savedLanguage === 'en' || savedLanguage === 'ru') return savedLanguage;
			} catch {}

			return navigator.language.toLowerCase().startsWith('ru') ? 'ru' : 'en';
		};

		const setLanguage = (language) => {
			const messages = translations[language];
			document.documentElement.lang = language;
			document.title = messages.title;

			document.querySelectorAll('[data-i18n]').forEach((element) => {
				element.innerHTML = messages[element.dataset.i18n];
			});
			document.querySelectorAll('[data-i18n-alt]').forEach((element) => {
				element.alt = messages[element.dataset.i18nAlt];
			});
			document.querySelectorAll('[data-i18n-aria-label]').forEach((element) => {
				element.setAttribute('aria-label', messages[element.dataset.i18nAriaLabel]);
			});

			document.querySelectorAll('[data-language]').forEach((button) => {
				const isActive = button.dataset.language === language;
				button.classList.toggle('is-active', isActive);
				button.setAttribute('aria-pressed', String(isActive));
			});

			const backLink = document.querySelector('.back-link');
			backLink.href = `./?lang=${language}`;

			try {
				window.localStorage.setItem(LANGUAGE_STORAGE_KEY, language);
			} catch {}

			const url = new URL(window.location.href);
			url.searchParams.set('lang', language);
			window.history.replaceState(null, '', url);
		};

		document.querySelectorAll('[data-language]').forEach((button) => {
			button.addEventListener('click', () => setLanguage(button.dataset.language));
		});

		setLanguage(getInitialLanguage());
	</script>
</body>
</html>
